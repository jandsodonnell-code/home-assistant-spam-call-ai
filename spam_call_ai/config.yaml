name: "Spam Call AI"
version: "0.8.9"
slug: "spam_call_ai"
description: "AI voice screening for inbound Twilio calls using OpenAI GPT-Live"
url: "https://github.com/jandsodonnell-code/home-assistant-spam-call-ai"
startup: application
boot: auto
init: false
stage: experimental
arch:
  - amd64
  - aarch64
homeassistant_api: true
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Spam Call AI webhook and WebSocket server"
watchdog: "http://[HOST]:[PORT:8000]/health"
options:
  openai_api_key: null
  twilio_account_sid: null
  twilio_auth_token: null
  ngrok_authtoken: null
  ngrok_domain: "wand-mold-displace.ngrok-free.dev"
  auto_tunnel: false
  max_call_minutes: 10
  analyze_calls: true
  analysis_model: "gpt-6-luna"
  live_transfer_enabled: false
  trusted_rering_enabled: true
  trusted_callers: ""
  trusted_rering_timeout_seconds: 15
  safe_voicemail_max_seconds: 120
  google_contacts_enabled: false
  google_contact_label: "Trusted Callers"
  google_contacts_sync_minutes: 15
  transfer_min_confidence: 0.92
  transfer_timeout_seconds: 25
  voice: "marin"
  greeting: "Hi, you've reached the automated call assistant. Who's calling, and what are you calling about?"
  initial_response_timeout_seconds: 8
  second_response_timeout_seconds: 7
  validate_twilio_signature: true
schema:
  openai_api_key: password
  twilio_account_sid: str
  twilio_auth_token: password
  ngrok_authtoken: password
  ngrok_domain: str
  auto_tunnel: bool
  public_base_url: "str?"
  max_call_minutes: "int(1,60)"
  analyze_calls: bool
  analysis_model: str
  live_transfer_enabled: bool
  trusted_rering_enabled: bool
  trusted_callers: str
  trusted_rering_timeout_seconds: "int(5,30)"
  safe_voicemail_max_seconds: "int(15,300)"
  google_contacts_enabled: bool
  google_oauth_client_id: "str?"
  google_oauth_client_secret: "password?"
  google_setup_key: "password?"
  google_contact_label: str
  google_contacts_sync_minutes: "int(5,1440)"
  forward_to_number: "str?"
  transfer_min_confidence: "float(0.5,1.0)"
  transfer_timeout_seconds: "int(10,60)"
  voice: str
  greeting: str
  initial_response_timeout_seconds: "int(4,30)"
  second_response_timeout_seconds: "int(4,30)"
  validate_twilio_signature: bool
