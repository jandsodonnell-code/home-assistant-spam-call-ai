type: vertical-stack
cards:
  - type: markdown
    content: |
      ## 📞 Spam Call AI
      {% if is_state('binary_sensor.spam_call_ai_online', 'on') %}
      **Status:** 🟢 Online
      {% else %}
      **Status:** 🔴 Offline
      {% endif %}

      **Active calls:** {{ states('sensor.spam_call_ai_active_calls') }}
      **Safe callers:** {{ states('sensor.spam_call_ai_safe_contacts') }}
      **Blocked callers:** {{ states('sensor.spam_call_ai_blocked_callers') }}

  - type: grid
    columns: 5
    square: false
    cards:
      - type: button
        entity: input_boolean.spam_call_ai_show_last_call
        name: Last
        icon: mdi:phone-log
        icon_height: 24px
        show_state: false
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.spam_call_ai_show_summary
        name: Summary
        icon: mdi:text-box-outline
        icon_height: 24px
        show_state: false
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.spam_call_ai_show_safe_callers
        name: Safe
        icon: mdi:account-check
        icon_height: 24px
        show_state: false
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.spam_call_ai_show_google_contacts
        name: Google
        icon: mdi:contacts
        icon_height: 24px
        show_state: false
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.spam_call_ai_show_blocked_callers
        name: Blocked
        icon: mdi:phone-off
        icon_height: 24px
        show_state: false
        tap_action:
          action: toggle

  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.spam_call_ai_show_last_call
        state: "on"
    card:
      type: entities
      title: Last Call
      show_header_toggle: false
      entities:
        - entity: sensor.spam_call_ai_last_caller_name
          name: Caller
        - entity: sensor.spam_call_ai_last_caller
          name: Number
        - entity: sensor.spam_call_ai_last_received_time
          name: Call Received
        - entity: sensor.spam_call_ai_last_call_type
          name: Call Type
        - entity: sensor.spam_call_ai_last_classification
          name: Classification
        - entity: sensor.spam_call_ai_last_spam_likelihood
          name: Spam Likelihood
        - entity: sensor.spam_call_ai_last_action
          name: Action
        - entity: sensor.spam_call_ai_last_duration
          name: Duration

  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.spam_call_ai_show_summary
        state: "on"
    card:
      type: markdown
      title: Last Call Summary
      content: |
        {% set summary = states('sensor.spam_call_ai_last_summary') %}
        {% if summary not in ['unknown', 'unavailable', 'No calls yet'] %}
        {{ summary }}
        {% else %}
        No completed call information yet.
        {% endif %}

        {% set callback = states('sensor.spam_call_ai_last_callback_number') %}
        {% if callback not in ['', 'unknown', 'unavailable', 'None'] %}
        **Callback:** {{ callback }}
        {% endif %}

  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.spam_call_ai_show_safe_callers
        state: "on"
    card:
      type: markdown
      title: Safe Callers
      content: |
        {% set contacts = state_attr('sensor.spam_call_ai_safe_contacts', 'contacts') or [] %}
        {% if contacts %}
        {% for contact in contacts %}
        ✅ {{ contact }}
        {% endfor %}
        {% else %}
        No safe contacts are currently listed.
        {% endif %}

        **Policy:** Safe callers bypass AI completely.

  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.spam_call_ai_show_google_contacts
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: entities
          title: Google Contacts
          show_header_toggle: false
          entities:
            - entity: sensor.spam_call_ai_google_sync_status
              name: Sync Status
            - entity: sensor.spam_call_ai_google_last_sync
              name: Last Sync
        - type: button
          name: Sync Google Contacts
          icon: mdi:sync
          tap_action:
            action: perform-action
            perform_action: rest_command.spam_call_ai_google_sync
          hold_action:
            action: none
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.spam_call_ai_google_sync_status
              state: "Error"
          card:
            type: markdown
            content: |
              **Google Contacts sync error**

              {{ state_attr('sensor.spam_call_ai_google_sync_status', 'last_error') or 'No error detail was provided.' }}


  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.spam_call_ai_show_blocked_callers
        state: "on"
    card:
      type: markdown
      title: Blocked Callers
      content: |
        {% set entries = state_attr('sensor.spam_call_ai_blocked_callers', 'entries') or [] %}
        {% if entries %}
        {% for entry in entries | reverse %}
        📵 **{{ entry.number | default('Unknown') }}**
        {% if entry.classification is defined %} — {{ entry.classification | title }}{% endif %}
        {% if entry.reason is defined and entry.reason %}

        {{ entry.reason }}
        {% endif %}

        {% endfor %}
        {% else %}
        No blocked callers are currently listed.
        {% endif %}
